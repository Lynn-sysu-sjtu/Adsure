<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广告合规审核</title>
    <link rel="stylesheet" href="/static/style.css">
    {% if memory_center_available %}<link rel="stylesheet" href="/static/memory_center.css">{% endif %}
</head>
<body>
    <!-- 飞书风格顶部导航栏 -->
    <div class="header">
        <div class="header-left">
            <div class="header-icon">审</div>
            <h1>广告合规审核</h1>
            <span class="badge-count" id="pending-count">0</span>
        </div>
        <div class="header-actions">
            {% if ops_enabled %}<a class="btn-icon btn-icon--labeled" href="/ops/deliveries" target="_blank" title="卡片管理后台（维护账号登录）">📦 卡片管理后台</a>{% endif %}
            <button class="btn-icon" onclick="refreshRecords()" title="刷新">↻</button>
        </div>
    </div>

    <!-- 主体布局 -->
    <div class="main">
        <!-- 左侧列表面板 -->
        <div class="sidebar">
            <div class="sidebar-tabs">
                <div class="sidebar-tab active" data-tab="pending">待处理</div>
                <div class="sidebar-tab" data-tab="done">已处理</div>
                <div class="sidebar-tab" data-tab="rules">规则库</div>
            </div>
            <div class="record-list" id="record-list"></div>
        </div>

        <!-- 右侧详情区 -->
        <div class="detail" id="detail-area">
            <div class="detail-empty">
                <div class="detail-empty-icon">📋</div>
                <p>选择左侧物料查看详情</p>
            </div>
        </div>
    </div>

    {% if memory_center_available %}<script src="/static/memory_center.js"></script>{% endif %}
    <script src="/static/main.js"></script>
    {% if audit_timeline_available %}<script src="/static/timeline.js"></script>{% endif %}
</body>
</html>
