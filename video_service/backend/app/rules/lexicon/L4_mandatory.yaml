# ══════════════════════════════════════════════════════════════════════
#  L4 · 必备要素与显著性核查
# ══════════════════════════════════════════════════════════════════════
#
# 与 L1/L2 的根本区别：那两层查「不该出现的词」，本层查两件事 ——
#   ① 法律要求必须出现的提示语，有没有出现？（缺失检测，AC 自动机做不了）
#   ② 出现了，但够不够「显著」？（时长 / 字号 / 位置）
#
# ②只有视频版才可能判定，是本产品相对文本审核工具的核心差异化能力。
#
# ⚠️ 本文件是起始版本，必须经法务复核后才能用于对外输出。
# ══════════════════════════════════════════════════════════════════════

meta:
  layer: L4
  kind: requirements
  name: 必备要素与显著性
  version: "0.1.0-draft"
  reviewed_by_legal: false

  # ⚠️ 这段话决定了本层输出的措辞边界，改代码时不要绕过它
  salience_disclaimer: >-
    法律上「显著」并无统一的量化标准，监管认定需结合整体情境。
    下列阈值是**产品层面的人工复核触发线**，不构成对是否违法的认定。
    报告措辞必须表述为「建议复核 / 存在被认定为未显著标明的风险」，
    不得表述为「已构成违规」。

# 默认显著性阈值，条目可各自覆盖
defaults:
  salience:
    min_duration: 1.0        # 秒：持续时间下限
    min_font_scale: 0.025    # 文字高度占画面高度的比例下限
    forbid_edge: true        # 是否禁止贴边（藏在角落）
    edge_margin: 0.08        # 距画面边缘小于此比例视为贴边

law_texts:
  ad_law_18_2: >-
    《中华人民共和国广告法》第十八条第二款：
    保健食品广告应当显著标明「本品不能代替药物」。
  ad_law_14: >-
    《中华人民共和国广告法》第十四条：广告应当具有可识别性，能够使消费者辨明其为广告。
    大众传播媒介发布广告应当显著标明「广告」，与其他非广告信息相区别，不得使消费者产生误解。
  ad_law_25: >-
    《中华人民共和国广告法》第二十五条：招商等有投资回报预期的商品或者服务广告，
    应当对可能存在的风险以及风险责任承担有合理提示或者警示。
  measures_9: >-
    《药品、医疗器械、保健食品、特殊医学用途配方食品广告审查管理暂行办法》第九条：
    医疗器械广告应当显著标明「请仔细阅读产品说明书或者在医务人员的指导下购买和使用」；
    非处方药广告应当显著标明「请按药品说明书或者在药师指导下购买和使用」。

entries:
  # ── 保健食品 ────────────────────────────────────────────────────────
  - id: health_food_disclaimer
    name: 保健食品必备声明
    industry: [health_food]
    required_any:
      - 本品不能代替药物
      - 本品不能代替药品
      - 保健食品不能代替药物
      - 保健食品不是药物，不能代替药物治疗疾病
    law_ref: "《广告法》第十八条第二款"
    law_text_ref: ad_law_18_2
    remedy: 在画面显著位置持续展示该声明，建议与主要功效宣称同屏呈现
    risk: high

  # ── 医疗器械 ────────────────────────────────────────────────────────
  - id: medical_device_disclaimer
    name: 医疗器械必备提示语
    industry: [medical_device]
    required_any:
      - 请仔细阅读产品说明书或者在医务人员的指导下购买和使用
      - 请仔细阅读产品说明书
      - 禁忌内容或者注意事项详见说明书
    law_ref: "《药品、医疗器械、保健食品、特殊医学用途配方食品广告审查管理暂行办法》第九条"
    law_text_ref: measures_9
    remedy: 在画面显著位置持续展示该提示语
    risk: high

  # ── 非处方药 ────────────────────────────────────────────────────────
  - id: otc_drug_disclaimer
    name: 非处方药必备提示语
    industry: [otc_drug]
    required_any:
      - 请按药品说明书或者在药师指导下购买和使用
      - 请按药品说明书或在药师指导下购买和使用
    law_ref: "《药品、医疗器械、保健食品、特殊医学用途配方食品广告审查管理暂行办法》第九条"
    law_text_ref: measures_9
    remedy: 在画面显著位置持续展示该提示语
    risk: high

  # ── 通用：广告可识别性 ──────────────────────────────────────────────
  - id: ad_identifiability
    name: 广告可识别性标识
    industry: ["*"]
    required_any:
      - 广告
      - 推广
      - 赞助
      - AD
    law_ref: "《广告法》第十四条"
    law_text_ref: ad_law_14
    remedy: 在画面以独立角标形式标注「广告」字样，使消费者能够辨明其为广告

    # ⚠️ 必须用 standalone：法条要求的是「与其他非广告信息**相区别**」，
    #    正文里出现「广告」二字不构成标识。
    #
    #    这条是实测踩出来的：拿团队既有 MVP 的真实 job 重放时，一条广告合规
    #    产品的演示视频（画面里满是「广告合规」「广告法」）被判「已显著标明」
    #    并通过。那是**假通过**——等于替客户签字说这条片子没问题，
    #    比误报危险得多。
    match: standalone

    # standalone 已能挡住绝大多数情形，这里再列一层是给将来改回
    # contains 模式时留的安全网。
    forbidden_contexts:
      - 广告法
      - 广告合规
      - 广告主
      - 广告位
      - 本广告
      - 违法广告
      - 虚假广告

    risk: medium

    # 仅提示，不计入风险数。
    # 理由是系统拿不到判断依据：抖音、快手的「广告」角标由**平台侧**添加，
    # 不在创意素材里。对着素材查这一条，必然条条都报缺失——
    # 实测 5 个真实 job 全部报缺，等于每条片子固定挂一条，
    # 真正的问题反而被淹没。
    # ⚠️ 不是判它通过：结论照常产出、照常进报告，只是不计入风险总数。
    advisory: true

    note: >-
      抖音、快手等平台通常由平台侧自动添加「广告」标识，而非由创意素材承担。
      本条命中时应先确认投放链路是否已由平台标注，再决定是否需要素材侧整改，
      不宜直接要求修改素材。
    # 这条阈值放宽：平台角标本就偏小、且本来就该放在角落，
    # 用通用阈值会大面积误报，反而把真正的问题淹没掉。
    salience:
      min_duration: 1.0
      min_font_scale: 0.012
      forbid_edge: false

  # ── 投资回报预期类 ──────────────────────────────────────────────────
  - id: investment_risk_warning
    name: 投资风险提示
    industry: [finance, investment, franchise]
    required_any:
      - 投资有风险
      - 入市有风险
      - 市场有风险
      - 加盟有风险
    law_ref: "《广告法》第二十五条"
    law_text_ref: ad_law_25
    remedy: 对可能存在的风险以及风险责任承担作出合理提示或警示
    risk: high
