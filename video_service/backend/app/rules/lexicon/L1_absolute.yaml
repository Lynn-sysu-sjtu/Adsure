# ══════════════════════════════════════════════════════════════════════
#  全局白名单短语
#
#  这些短语本身完全合法，但内含 L1 词面（「第一时间」含「第一」）。
#  匹配器先跑一遍白名单，命中若被某条白名单短语**完整包含**则直接抑制。
#  依据：《广告绝对化用语执法指南》豁免情形③「表示时间或空间顺序的」。
#
#  ⚠️ 不变式：**每条白名单短语必须至少包含一个 entries 里的词面**，
#     否则它永远不会被触发，是死配置。tests/test_matcher.py 里有断言守这条。
#
#  只放"第一"家族：其余各词的白名单挂在自己的 whitelist_contexts 下，
#  就近维护，避免同一条短语在两处重复。
# ══════════════════════════════════════════════════════════════════════
global_whitelist:
  - 第一时间
  - 第一步
  - 第一次
  - 第一季度
  - 第一季
  - 第一集
  - 第一章
  - 第一节
  - 第一排
  - 第一层
  - 第一人称
  - 第一志愿
  - 第一现场
  - 第一手
