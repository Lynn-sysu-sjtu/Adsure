  # ── "第一" 家族 ─────────────────────────────────────────────────────
  # 白名单最重要的一族：「第一时间」「第一步」是时间/空间顺序，明确豁免。
  #
  # 这里刻意收录**裸词「第一」**：只枚举「第一品牌」「全国第一」这类固定搭配的话，
  # 「亚洲第一」「口碑第一」「服务第一」等没想到的说法会直接漏检，
  # 而粗筛层的目标是高召回。误报由 global_whitelist（时间/空间顺序）
  # 与 LLM 语境复判两道闸兜住。
  - term: 第一
    industry: ["*"]
    law_ref: "《广告法》第九条第（三）项"
    law_text_ref: ad_law_9_3
    judgment_points: >-
      裸词高召回条目，误报率天然偏高，**命中不等于违规**。
      需重点区分：表时间/空间顺序（豁免）vs 表排名断言（违规）。
    exempt_hints:
      - "是否表示时间或空间顺序（如「第一时间」「第一排」）？若是，属执法指南豁免情形③"
      - "是否附有可查证的第三方评选/统计数据？"
    cases: []
    risk: medium

