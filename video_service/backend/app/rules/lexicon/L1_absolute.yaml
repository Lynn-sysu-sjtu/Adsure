# ══════════════════════════════════════════════════════════════════════
#  L1 · 绝对化用语词库
#  法律依据：《广告法》第九条第（三）项 + 《广告绝对化用语执法指南》(2023)
# ══════════════════════════════════════════════════════════════════════
#
# ⚠️ 本文件是**起始版本，必须经法务复核后才能用于对外输出**。
#    真正的词库应当从行政处罚决定书里反向挖掘（见 tasks 方案 3.1 节）——
#    被真实处罚过的表述，比任何人凭印象列的词都准，而且自带类案证据。
#
# ── 字段说明 ──────────────────────────────────────────────────────────
#   term              命中词面
#   level             L1 固定
#   industry          适用行业，["*"] 表示通用
#   law_ref           法条出处（写进报告的「法律依据」段，必须真实可查）
#   law_text          法条原文摘录（喂给 LLM，禁止它自己编法条）
#   judgment_points   判定要点，指导 LLM 复判该看什么
#   whitelist_contexts  白名单语境：命中词若落在这些短语内，直接抑制，不报风险
#   exempt_hints      豁免线索：不能自动抑制，但要提示 LLM 重点核查是否属豁免情形
#   cases             关联类案 id（对接王亦澄类案库，现为占位）
#   risk              high / medium / low
#
# ── 《广告绝对化用语执法指南》的五类豁免情形（白名单设计的依据）──────
#   ① 不指向所推销的商品/服务的
#   ② 仅表明服务态度、经营理念、企业文化、价值观、目标追求的
#   ③ 表示时间或空间顺序的（"第一时间""第一步""第一排"）
#   ④ 依据国家标准/行业标准对商品等级、类别作客观描述的（"特级""一级"）
#   ⑤ 有充分证据证明其真实性的（"销量第一"附可查证第三方数据）
#
#   ③④ 可以靠白名单语境自动抑制；①②⑤ 依赖上下文与举证材料，
#   只能交给 LLM 复判 + 要求运营补材料，所以放进 exempt_hints。
# ══════════════════════════════════════════════════════════════════════

meta:
  layer: L1
  kind: terms
  name: 绝对化用语
  version: "0.1.0-draft"
  reviewed_by_legal: false          # ⚠️ 法务复核前不得用于对外报告
  primary_law: "《中华人民共和国广告法》第九条第（三）项"
  guideline: "《广告绝对化用语执法指南》（市场监管总局，2023）"

# 通用法条文本，条目里用 law_text_ref 引用，避免重复几十遍
law_texts:
  ad_law_9_3: >-
    《中华人民共和国广告法》第九条：广告不得有下列情形：……
    （三）使用"国家级"、"最高级"、"最佳"等用语；……
  ad_law_28: >-
    《中华人民共和国广告法》第二十八条：广告以虚假或者引人误解的内容欺骗、误导消费者的，
    构成虚假广告。……（二）商品的性能、功能、产地、用途、质量、规格、成分、价格、生产者、
    有效期限、销售状况、曾获荣誉等信息……与实际情况不符，对购买行为有实质性影响的。

# 全局豁免提示，所有 L1 条目共用
common_exempt_hints:
  - "该表述是否指向所推销的商品/服务？若仅描述企业价值观、服务态度、目标追求，可能不适用第九条第三项"
  - "是否属于国家标准或行业标准中的等级、类别名称？若是，属客观描述"
  - "是否有可查证的第三方数据支撑？若有充分证据证明真实性，需结合证据材料判断"

entries:
