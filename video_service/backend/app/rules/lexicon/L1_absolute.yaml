    industry: ["*"]
    law_ref: "《广告法》第九条第（三）项"
    law_text_ref: ad_law_9_3
    judgment_points: "法条明文列举的用语，指向商品/服务时基本无抗辩空间。"
    whitelist_contexts:
      - 国家级自然保护区
      - 国家级非物质文化遗产
      - 国家级高新技术企业
      - 国家级经济技术开发区
      - 国家级实验室
      - 国家级重点实验室
      - 国家级科技企业孵化器
      - 国家级龙头企业
