      无出处的则同时触及绝对化用语与虚假广告。**这条必须要材料，不能直接删词。**
    exempt_hints:
      - "是否标注了数据来源、统计口径、统计时间段？"
      - "数据来源是否为独立第三方且可公开查证？"
    cases: []
