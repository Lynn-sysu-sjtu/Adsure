  - term: 最大
    industry: ["*"]
    law_ref: "《广告法》第九条第（三）项"
    law_text_ref: ad_law_9_3
    judgment_points: "需区分「规模最大」（排名断言）与「最大限度」（程度副词）。"
    whitelist_contexts:
      - 最大限度
      - 最大程度
      - 最大化
