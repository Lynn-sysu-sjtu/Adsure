law_texts:
  ad_law_17: >-
    《中华人民共和国广告法》第十七条：除医疗、药品、医疗器械广告外，
    其他广告不得涉及疾病治疗功能，也不得使用医疗用语或者易使商品与药品、
    医疗器械相混淆的用语。
  ad_law_17_18: >-
    《中华人民共和国广告法》第十七条：除医疗、药品、医疗器械广告外，
    其他广告不得涉及疾病治疗功能……第十八条：保健食品广告不得含有下列内容：
    （一）表示功效、安全性的断言或者保证；（二）涉及疾病预防、治疗功能……
  ad_law_08_28: >-
    《中华人民共和国广告法》第八条：广告中对商品的……允诺等有表示的，
    应当准确、清楚、明白。第二十八条：广告以虚假或者引人误解的内容
    欺骗、误导消费者的，构成虚假广告。

