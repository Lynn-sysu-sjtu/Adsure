<script>
  window.__BILIACT_ENV__ = "H5";
  window.__initialState = {"GlobalConfig":{"animation":{"schemes":{},"bindMap":{}},"events":{"schemes":{},"eventMap":{}}},"BaseInfo":{"__activity_id":61643,"headerTemplate":"header","jumpUrl":"","shareCloseRequire":false,"sharePicture":"","shareText":"","title":"花火商单视频审核管理规范"},"h5-rich-text2":[{"diableRemParse":true,"htmlObj":{"dangerHtml":"<p style=\"text-align:left;\"></p>\n<p></p>\n<p style=\"text-align:center;\"><span style=\"font-size: 24px;\">花火商单视频审核管理规范</span></p>\n<p></p>\n<p></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;商业广告视频是指，在视频内容中含有对某商品、服务进行有偿推广行为的视频。由于商单视频制作主体为up主，且初上线群体为up主粉丝，故在视频上的纯内容侧遵循创作公约，广告侧应当严格遵守广告法。</p>\n<p></p>\n<p><strong>序言：</strong></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;商业广告视频审核基本规范</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;1、商业广告视频审核重点关注对商品、服务进行推广表达的标题、封面、描述、视频等内容。</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2、广告应当同时遵守《广告法》等法律、法规的基本规定以及平台审核、设计规范。</p>\n<p></p>\n<p></p>\n<p><strong>商单视频与推广规范：</strong></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;［1］行业准入规定</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;［2］基本注意事项</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;［3］不同行业审核规范</p>\n<p></p>\n<p></p>\n<p></p>\n<p><span style=\"font-size: 16px;\"><strong>［1］行业准入规定</strong></span></p>\n<p></p>\n<img src=\"https://i0.hdslb.com/bfs/activity-plat/static/e2080d153bdf4de08d62649fad2c59be/99yyK4Z49N_w1194_h422.png\" alt=\"\" style=\"height: 140px;width: 400px\"/>\n<p><span style=\"color: rgb(208,2,27);\">注：由于金融服务、计生用品、医疗仅可通过官方资质认证后准入，若未通过资质认证的客户稿件选择其他可准入行业逃避审查，一经发现，将以驳回处理</span></p>\n<p></p>\n<p></p>\n<p></p>\n<p><span style=\"font-size: 16px;\"><strong>［2］基本注意事项</strong></span></p>\n<p></p>\n<p><strong>一、广告内容需遵循《广告法》及相关法律、法规规定</strong></p>\n<p></p>\n<p><strong>角色说明简介：</strong></p>\n<p>1.广告主：是指为推销商品或者服务，自行或者委托他人设计、制作、发布广告的自然人、法人或者其他组织。</p>\n<p>2.广告经营者：是指接受委托提供广告设计、制作、代理服务的自然人、法人或者其他组织。</p>\n<p>3.广告发布者：是指为广告主或者广告主委托的广告经营者发布广告的自然人、法人或者其他组织。</p>\n<p>4.广告代言人：是指广告主以外的，在广告中以自己的名义或者形象对商品、服务作推荐、证明的自然人、法人或者其他组织。</p>\n<p></p>\n<p><strong>广告内容基础准则：</strong></p>\n<p>1.广告应当真实、合法，符合法律法规与社会主义价值观，不得含有虚假的内容，不得欺骗和误导消费者。</p>\n<p>2.广告中对商品的性能、功能、产地、用途、质量、成分、价格、生产者、有效期限、允诺等或者对服务的内容、提供者、形式、质量、价格、允诺等有表示的，应当准确、清楚、明白。 广告中表明推销的商品或者服务附带赠送的，应当明示所附带赠送商品或者服务的品种、规格、数量、期限和方式。 法律、行政法规规定广告中应当明示的内容，应当显著、清晰表示。</p>\n<p>3.广告内容涉及的事项需要取得行政许可的，应当与许可的内容相符合。 广告使用数据、统计资料、调查结果、文摘、引用语等引证内容的，应当真实、准确，并表明出处（引证内容需要为有公信力的国家官方机构，不得为民间组织或个人）。引证内容有适用范围和有效期限的，应当明确表示。</p>\n<p>4.广告中涉及专利产品或者专利方法的，应当标明专利号和专利种类。 未取得专利权的，不得在广告中谎称取得专利权。 禁止使用未授予专利权的专利申请和已经终止、撤销、无效的专利作广告。</p>\n<p></p>\n<p><strong>二、广告不得存在如下情形</strong></p>\n<p></p>\n<p>1、使用或者变相使用中华人民共和国的国旗、国歌、国徽，军旗、军歌、军徽；</p>\n<p>2、使用或者变相使用任何国家的国家机关、国家机关工作人员的名义或者形象；</p>\n<p>3、使用“国家级”、“最高级”、“最佳”等绝对化用语；</p>\n<p>4、损害国家的尊严或者利益，泄露国家秘密；</p>\n<p>5、使用流通货币用作商业推广；</p>\n<p>6、妨碍社会安定，损害社会公共利益；</p>\n<p>7、危害人身、财产安全，泄露个人隐私；</p>\n<p>8、妨碍社会公共秩序或者违背社会良好风尚；</p>\n<p>9、含有淫秽、色情、赌博、迷信、恐怖、暴力的内容；</p>\n<p>10、含有民族、种族、宗教、性别歧视的内容；</p>\n<p>11、妨碍环境、自然资源或者文化遗产保护；</p>\n<p>12、涉及名人无授权或违反广告代言规则；</p>\n<p>13、涉及央视等媒体无授权，如央视合作伙伴；</p>\n<p>14、涉及商标无授权或使用驰名商标；</p>\n<p>15、涉及知识产权侵权，如作品抄袭；</p>\n<p>16、使用专家推荐的违禁词汇，无授权证明使用明星推荐；</p>\n<p>17、有奖销售最高奖的金额超过五万元；</p>\n<p>18、歪曲、丑化、亵渎、否定英雄烈士事迹和精神；</p>\n<p>19、损害未成年人和残疾人的身心健康或贬低他人的；</p>\n<p>20、贬低其他生产经营者的商品或者服务；</p>\n<p>21、投放虚假或引人误解的广告；</p>\n<p>22、法律、行政法规规定禁止的其他情形；</p>\n<p><span style=\"color: rgb(208,2,27);\">注：若使用中国地图，须使用经国家测绘部门审批通过且标明“审图号”的地图，并在地图或附着地图图形的素材上显著标注审图号；国界必须清晰，无论陆地还是海洋，都必须清楚标明国界线，且完整显示南海诸岛等；依国家规定称呼港澳台，不得与其他主权国家并列</span></p>\n<p></p>\n<p></p>\n<p></p>\n<p><span style=\"font-size: 16px;\"><strong>［3］不同行业审核规范</strong></span></p>\n<p></p>\n<p><strong>一、关于医疗、药品、保健食品、特殊医学用途配方食品、医疗器械、兽药、医疗机构类推广基本策略</strong></p>\n<p></p>\n<p>1、视频封面以及视频中涉及对商品、服务进行描述、使用的，应当提供相应的广审文件；且广审内容应当与视频内容相一致（广审内容不得自行修改或拼接）</p>\n<p></p>\n<p><strong>二、关于医疗、药品、保健食品、特殊医学用途配方食品、医疗器械、兽药、医疗机构类推广基本审核规范</strong></p>\n<p></p>\n<p>1、药品、医疗器械、特殊医学用途配方食品、保健食品广告应当显著标明广告批准文号。</p>\n<p>2、药品、医疗器械、特殊医学用途配方食品、保健食品广告中应当显著标明的内容，其字体和颜色必须清晰可见、易于辨认，在视频广告中应当持续显示\t</p>\n<p>3、医疗、药品、医疗器械、特殊医学用途配方食品、保健食品广告不得含有下列内容：&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;1）违反科学规律，明示或者暗示可以治疗所有疾病、适应所有症状、适应所有人群，或者正常生活和治疗病症所必需等内容（如包治百病、治一个好一个、根治、痊愈）等承诺性用语；</p>\n<p>&nbsp;&nbsp;&nbsp;2）表示功效的断言，如说明治愈率或者有效率（如康复率达到98%）；&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;3）引起公众对所处健康状况和所患疾病产生不必要的担忧和恐惧，或者使公众误解不使用该产品会患某种疾病或者加重病情的内容；</p>\n<p>&nbsp;&nbsp;&nbsp;4）含有“安全”“安全无毒副作用”“毒副作用小”；明示或者暗示成分为“天然”，因而安全性有保证等内容；</p>\n<p>&nbsp;&nbsp;&nbsp;5）含有医疗机构的名称、地址、联系方式、诊疗项目、诊疗方法以及有关义诊、医疗咨询电话、开设特约门诊等医疗服务的内容;</p>\n<p>&nbsp;&nbsp;&nbsp;6）与其他药品、医疗器械的功效和安全性或者其他医疗机构比较；&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;7）利用广告代言人或专家、患者的名义做作推荐、证明；&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;8）含有评比、排序、推荐、指定、选用、获奖等综合性评价内容；</p>\n<p>&nbsp;&nbsp;&nbsp;9）涉及医疗技术、诊疗方法、疾病名称、药物的（如细胞治疗、乙型肝炎）；</p>\n<p>&nbsp;&nbsp;&nbsp;10）含有无法证实其科学性的所谓“研究发现”、“实验或数据证明”等方面的内容；</p>\n<p>&nbsp;&nbsp;&nbsp;11）明示或暗示该产品为正常生活和治疗病症所必需等内容，如“家庭必备”或类似内容；</p>\n<p>&nbsp;&nbsp;&nbsp;12）明示或暗示该产品能应付现代紧张生活和升学、考试等需要，能够帮助提高成绩、使精力旺盛、增强竞争力、增高、益智等内容；</p>\n<p>&nbsp;&nbsp;&nbsp;13）含有涉及公共信息、公共事件或其他与公共利益相关联的内容，如各类疾病信息、经济社会发展成果或医疗科学以外的科技\t</p>\n<p>&nbsp;&nbsp;&nbsp;14）以介绍健康、养生知识等形式变相发布药品、医疗器械、特殊医学用途配方食品；</p>\n<p>&nbsp;&nbsp;&nbsp;15）涉及推广单个医疗项目；</p>\n<p>&nbsp;&nbsp;&nbsp;16）法律、行政法规规定禁止的其他内容。</p>\n<p>4、广告中应当显著标明“禁忌内容或者注意事项详见说明书”，并应当显著标明禁忌、不良反应，且不得与监督管理部门批准的说明书不一致。</p>\n<p>5、除医疗、药品、医疗器械广告，禁止其他任何广告涉及疾病治疗功能，并不得使用医疗用语或者易使推销的商品与药品、医疗器械相混淆的用语。</p>\n<p></p>\n<p>（一）医疗器械类广告</p>\n<p></p>\n<p>1、不得以任何非医疗器械产品名称代替医疗器械产品名称进行宣传</p>\n<p>2、不得以儿童为诉求对象，不得以儿童的名义介绍医疗器械</p>\n<p>3、不得含有不科学的表述或者使用不恰当的表现形式，引起公众对所处健康状况和所患疾病产生不必要的担忧和恐惧，或者使公众误解不使用该产品会患某种疾病或加重病情</p>\n<p>4、不得含有表述该产品处于“热销”、“抢购”、“试用”等内容</p>\n<p></p>\n<p>（二）OTC药品</p>\n<p></p>\n<p>1、药品广告不得以儿童为诉求对象</p>\n<p>1）不得以儿童的形象（含儿童卡通形象）或儿童的声音（含模仿儿童的声音）介绍药品</p>\n<p>2）不得直接向儿童（含儿童卡通形象）宣传、介绍药品</p>\n<p></p>\n<p>（三）医疗机构</p>\n<p></p>\n<p>1、若为医疗机构推广仅允许发布：第一名称；医疗机构地址；所有制形式；医疗机构类别；诊疗科目；床位数；接诊时间；联系电话</p>\n<p>2、若为医美类型的医疗机构的项目推广，仅允许发布轻医美相关项目（如：小气泡、补水护肤等）或部分重医美相关项目（如：激光、三针等）</p>\n<p></p>\n<p>（四）宠物医院</p>\n<p></p>\n<p>1、诊所宣传禁止离居民楼、幼儿园、学校、超市、农贸市场等人流密集区 15 米以内（参考《中华人民共和国动物防疫法十九条》）&nbsp;</p>\n<p>2、禁止宣传在居民小区、机关、企事业单位等场所内院从事动物诊疗活动（参考《中华人民共和国动物防疫法十九条）</p>\n<p>3、禁止出现无痛、安全、保证等虚假宣传</p>\n<p>4、不得涉及售卖兽药</p>\n<p></p>\n<p>（五）保健食品</p>\n<p></p>\n<p>广告应当显著标明“保健食品不是药物，不能代替药物治疗疾病”，声明本品不能代替药物，并显著标明保健食品标志（保健食品的蓝帽标识）、适宜人群和不适宜人群。</p>\n<p></p>\n<p>（六）农药、兽药、饲料和饲料添加剂类</p>\n<p></p>\n<p>1、兽药、饲料和饲料添加剂广告不得含有下列内容：&nbsp;</p>\n<p>1）表示功效、安全性的断言或者保证；&nbsp;</p>\n<p>2）利用科研单位、学术机构、技术推广机构、行业协会或者专业人士、用户的名义或者形象作推荐、证明；&nbsp;</p>\n<p>3）说明有效率；&nbsp;</p>\n<p>4）违反安全使用规程的文字、语言或者画面；&nbsp;</p>\n<p>5）法律、行政法规规定禁止的其他内容。</p>\n<p></p>\n<p><strong>三、关于美容化妆类推广基本审核规范</strong></p>\n<p></p>\n<p>1、不得使用他人名义保证或者以暗示方法使人误解其效用。</p>\n<p>2、不得宣传医疗作用或者使用医疗术语。</p>\n<p>3、普通美容院不得涉及手术开刀等项目（凡有伤口即认定为手术），或其他医疗器械以及其他具有创伤性或侵入性的医学技术方法进行修复与再塑的项目。</p>\n<p>4、口红、眼影类化妆品不可涉及试色图侵权：著名博主试色图、带博主logo的试色图禁止使用。</p>\n<p>5、化妆品广告不得包含承诺行描述，如根治、治愈。</p>\n<p>6、普通美容院仅可推广品牌向内容，不得涉及单个项目推广</p>\n<p>7、不得使用患者形象或患者病理图（即患处放大图）</p>\n<p>8、美妆类广告不得进行前后对比展示来凸显效果</p>\n<p></p>\n<p><strong>四、关于金融类推广基本审核规范</strong></p>\n<p></p>\n<p>1、招商等有投资回报预期的商品或者服务广告，应当对可能存在的风险以及风险责任承担有合理提示或者警示（如投资有风险，理财需谨慎），并不得含有下列内容：&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;1）对未来效果、收益或者与其相关的情况作出保证性承诺，明示或者暗示保本、无风险或者保收益等</p>\n<p>&nbsp;&nbsp;&nbsp;2）利用学术机构、行业协会、专业人士、受益者的名义或者形象作推荐、证明。</p>\n<p>&nbsp;&nbsp;&nbsp;3）禁止导流到QQ群或微信号等社交工具，不得含有“免费加群”“微信群号”等引导用户加群的话术</p>\n<p>2、银行类广告还需遵循如下规定：</p>\n<p>&nbsp;&nbsp;&nbsp;1）信用卡业务广告不得涉及承诺信额\t</p>\n<p>&nbsp;&nbsp;&nbsp;2）不得使用用手机号、指纹等非常规办卡形式的描述</p>\n<p>&nbsp;&nbsp;&nbsp;3）禁止使用偶发性内容作为推广噱头，如“三秒下卡”等，需提供相关证明</p>\n<p>&nbsp;&nbsp;&nbsp;4）信用卡额度申请额度达5万以上时候，需提供银行相关额度证明，并在稿件中标注【根据申请人条件不同，最终额度会有不同】的提示语。</p>\n<p>3、股票类广告还需遵循如下规定：</p>\n<p>&nbsp;&nbsp;&nbsp;1）广告不得涉及单个个股推荐，包括出现具体股票代码、名称</p>\n<p>&nbsp;&nbsp;&nbsp;2）不得出现“配资炒股”、“借钱炒股”、“股票配资”等内容</p>\n<p>&nbsp;&nbsp;&nbsp;3）股票不得涉及“揭秘”、“泄露机密”、“内部消息”等暗示诱导的描述</p>\n<p>&nbsp;&nbsp;&nbsp;4）不得直接使用真实K线截图作为广告素材或使用某一支股票的K线图。虚拟K线图不得带有暗示股票上涨的设计。</p>\n<p>4、汽车金融类广告还需遵循如下规定：</p>\n<p>&nbsp;&nbsp;&nbsp;1）不得出现0首付的业务推广\t</p>\n<p>&nbsp;&nbsp;&nbsp;2）汽车类广告中出现具体机构贷款服务需要补充跟金融机构的合作协议，并在广告中说明相关金融业务和活动介绍</p>\n<p>&nbsp;&nbsp;&nbsp;3）如是涉及商家自身业务补贴优惠活动，需在广告中说明详细活动内容并引导到店了解</p>\n<p>5、贷款类广告还需遵循如下规定：</p>\n<p>&nbsp;&nbsp;&nbsp;1）贷款广告不得使用 “0门槛”的描述，不可是用仅凭身份证即可贷款、不看征信可贷款等描述</p>\n<p>&nbsp;&nbsp;&nbsp;2）禁止出现还款无压力、轻松还款等描述</p>\n<p>&nbsp;&nbsp;&nbsp;3）不得使用诱导性贷款描述（如欠款太多还补上、逾期不可怕）</p>\n<p>&nbsp;&nbsp;&nbsp;4）不得投放针对学生，高校客群的贷款产品</p>\n<p>&nbsp;&nbsp;&nbsp;5）不得出现以下词语：身份证即可办理、砍头息、0 利息、无息、包批、包下款、不看征信、黑户、担保无抵押、秒借、0 风险、高收益、高回报等不符合实际的描述</p>\n<p>&nbsp;&nbsp;&nbsp;6）在使用日费率、月费率的同时，需要在稿件中标注年化费率，且符合费率区间，累计利率不得超过24%（借贷双方约定的利率未超过年利率24%，出借人有请求借款人按照约定的利率支付利息）</p>\n<p>&nbsp;&nbsp;&nbsp;7）不得含有超前消费、过度消费和从众消费等错误观念内容</p>\n<p></p>\n<p><strong>五、关于酒类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>酒类广告不得含有下列内容：</strong>&nbsp;</p>\n<p>&nbsp;1）诱导、怂恿饮酒或者宣传无节制饮酒；&nbsp;</p>\n<p>&nbsp;2）出现饮酒的动作（如：举起酒杯，或举杯朝嘴部的相似动作、劝酒/灌酒等动作）；</p>\n<p>&nbsp;3）表现驾驶车、船、飞机等活动；&nbsp;</p>\n<p>&nbsp;4）明示或者暗示饮酒有消除紧张和焦虑、增加体力等功效。</p>\n<p>&nbsp;5）含有未成年人的形象（包含未成年人的卡通形象）</p>\n<p>&nbsp;6）使用医疗用语或者易与药品混淆的用语</p>\n<p></p>\n<p><strong>六、关于母婴类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>母婴食品类广告不得含有下列内容：</strong></p>\n<p>&nbsp;1）不得明示或者暗示可以替代母乳，不得使用母乳哺乳中的妇女和婴儿的形象</p>\n<p>&nbsp;2）不得对0-12个月婴儿食用的奶粉进行广告宣传</p>\n<p>&nbsp;3）不得使用进口奶源、源自国外牧场、生态牧场、进口原料”等模糊信息； 涉及原料来源的（如生乳、原料乳粉等原料来源），应当如实标明具体来源地或者来源； 如：新西兰进口奶源、源自澳大利亚牧场等</p>\n<p>&nbsp;4）不得明示或者暗示具有益智、增加抵抗力或者免疫力、保护肠道等功能性表述。不得对于按照食品安全标准不应当在产品配方中含有或者使用的物质，以“不添加”“不含有”“零添加”等字样强调未使用或者不含有</p>\n<p></p>\n<p><strong>七、关于征婚交友类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>征婚交友广告不得含有下列内容：</strong></p>\n<p>&nbsp;1）婚恋交友行业广告出现有歧义、淫秽、隐晦、擦边等内容；&nbsp;</p>\n<p>&nbsp;2）出现夕阳红、二婚等内容；&nbsp;</p>\n<p>&nbsp;3）出现分离小三、婚姻破裂等</p>\n<p></p>\n<p><strong>八、关于招聘类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>招聘广告不得含有下列内容：</strong></p>\n<p>&nbsp;1）稿件上职位不得与实际推荐职位不一致；&nbsp;</p>\n<p>&nbsp;2）稿件以及落地必须为开户通过审核的产品平台，不得跳转至其他招聘平台；</p>\n<p>&nbsp;3）广告素材内提及工作薪资，须在稿件内体现或提供相关证明；&nbsp;</p>\n<p>&nbsp;4）出现工作职能描述不清的职业；</p>\n<p>&nbsp;5）出现工作描述仅为：在家躺着也能赚钱、一部手机就能赚钱等</p>\n<p>&nbsp;6）出现低俗擦边职业描述：学生妹晚上去赚点零花钱等</p>\n<p>&nbsp;7）出现打字员、刷单、涨粉、刷评论等职位</p>\n<p></p>\n<p><strong>九、关于教育类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>教育培训类广告不得含有下列内容：</strong></p>\n<p>&nbsp;1）对升学、通过考试、获得学位学历或者合格证书，或者对教育、培训的效果作出明示或者暗示的保证性承诺，如包过、百分百通过、保过、100%通过、包通过、保通过、免考拿本科、免学等承诺性描述</p>\n<p>&nbsp;2）明示或者暗示有相关考试机构或者其工作人员、考试命题人员参与教育、培训</p>\n<p>&nbsp;3）利用科研单位、学术机构、教育机构、行业协会、专业人士、受益者的名义或者形象作推荐、证明</p>\n<p>&nbsp;4）非学位授予单位不得声称可以授予学位</p>\n<p>&nbsp;5）以新闻报道的形式或以“国家发布新规”、“教育改革”等虚假信息做宣传，误导消费者</p>\n<p>&nbsp;6）涉及虚假宣传，使用“奖学金”、“高薪、高收入”等为噱头诱导用户点击</p>\n<p>&nbsp;7）金融类课程：涉及单个理财项目，个人教师项目，暗示成效（如：学了之后能赚大钱）</p>\n<p>&nbsp;8）医疗类课程：涉及失传秘方教育，明示医疗成效等</p>\n<p>&nbsp;9）涉及宣导学习某一技术/技能为由，不上大学、不上高中等</p>\n<p>&nbsp;10）涉及K12阶段的任意培训辅导等（需管控教育阶段：幼儿园、小学、初中、高中；学科类课外培训：语文、数学、外语、物理、化学、地理、政治、历史、生物等应试范围的基础学科类培训）</p>\n<p>&nbsp;11）普通组织机构不得在广告中使用“大学”“学院”字样（除经批准设立的大学、学院以及由其设立的内部机构或由其发起并依法登记的组织机构外）</p>\n<p></p>\n<p><strong>十、关于电商类推广基本审核规范</strong></p>\n<p></p>\n<p>1、广告应当真实、合法，以健康的表现形式表达广告内容</p>\n<p>不得对商品的性能、功能、产地、用途、质量、成分、价格、生产者、有效期限等进行夸大或承诺性描述</p>\n<p>2、若广告商品满足下述条件，还需提供相关正品证明</p>\n<p>&nbsp;1）奢侈品、知名品牌（包括但不限于鞋、包、表、手机、相机等）</p>\n<p>&nbsp;2）数码3C折扣低于5折（含5折）；其他类别折扣低于3折（含3折）</p>\n<p>3、若广告内容含有优惠活动信息，则需在广告显著位置进行说明，包括：</p>\n<p>1）在稿件上进行明示（如限时秒杀活动），且不可将活动价作为正常价格展示，以致误导用户，构成虚假宣传</p>\n<p>2）稿件所描述活动细则需与实际活动描述一致，</p>\n<p>3）若稿件上有活动，实际导向活动无细则，还需要额外提供活动证明</p>\n<p></p>\n<p><strong>十一、关于普通食品类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>普通食品广告不得含有下列内容：</strong></p>\n<p>&nbsp;1）不得含有“纯天然”等虚假描述（注：只要是经过人工培育，无论是否为天然长成均不属于”纯天然“）</p>\n<p>&nbsp;2）不得单纯描述无添加食品，文案中需标记注释无添加元素（如：不添加香精防腐剂）</p>\n<p>&nbsp;3）金银箔粉不属于食品添加剂，不能用于食品生产经营。不得发布以金银箔粉作为食品原料或者食品添加剂生产的食品广告（含国产和进口食品），不得发布经营可食用金银箔粉的广告</p>\n<p>&nbsp;4）不得发布以食品添加金银箔粉（含）为噱头宣扬奢靡享乐、拜金主义等违背社会良好风尚的广告</p>\n<p>&nbsp;5）食品广告中不得明示或者暗示金银箔粉可食用，也不得借助食品添加金银箔粉宣传具有保健功能、治疗功效等特殊功效</p>\n<p></p>\n<p></p>\n<p></p>\n<p></p>\n<p></p>\n<p></p>\n"},"headTitle":"","lineHeight":26,"_asyncData":{},"@woodman/node":"MdEc8REnLER","id":"MdEc8REnLER"}],"firstScreenResource":[],"h5-baseinfo":[{"_asyncData":{}}]};

  window.__BILIACT_MODULES__ = {"root":{"config":{"_asyncData":{}},"boxConfig":{},"framework":"core","id":"root","info":"模板配置","parent":null,"source":"library","tag":"h5-baseinfo","values":{"_asyncData":{}},"version":"0.1.17"},"MdEc8REnLER":{"id":"MdEc8REnLER","tag":"h5-rich-text2","info":"富文本","parent":"Body","config":{"diableRemParse":true,"htmlObj":{"dangerHtml":"<p style=\"text-align:left;\"></p>\n<p></p>\n<p style=\"text-align:center;\"><span style=\"font-size: 24px;\">花火商单视频审核管理规范</span></p>\n<p></p>\n<p></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;商业广告视频是指，在视频内容中含有对某商品、服务进行有偿推广行为的视频。由于商单视频制作主体为up主，且初上线群体为up主粉丝，故在视频上的纯内容侧遵循创作公约，广告侧应当严格遵守广告法。</p>\n<p></p>\n<p><strong>序言：</strong></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;商业广告视频审核基本规范</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;1、商业广告视频审核重点关注对商品、服务进行推广表达的标题、封面、描述、视频等内容。</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2、广告应当同时遵守《广告法》等法律、法规的基本规定以及平台审核、设计规范。</p>\n<p></p>\n<p></p>\n<p><strong>商单视频与推广规范：</strong></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;［1］行业准入规定</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;［2］基本注意事项</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;［3］不同行业审核规范</p>\n<p></p>\n<p></p>\n<p></p>\n<p><span style=\"font-size: 16px;\"><strong>［1］行业准入规定</strong></span></p>\n<p></p>\n<img src=\"https://i0.hdslb.com/bfs/activity-plat/static/e2080d153bdf4de08d62649fad2c59be/99yyK4Z49N_w1194_h422.png\" alt=\"\" style=\"height: 140px;width: 400px\"/>\n<p><span style=\"color: rgb(208,2,27);\">注：由于金融服务、计生用品、医疗仅可通过官方资质认证后准入，若未通过资质认证的客户稿件选择其他可准入行业逃避审查，一经发现，将以驳回处理</span></p>\n<p></p>\n<p></p>\n<p></p>\n<p><span style=\"font-size: 16px;\"><strong>［2］基本注意事项</strong></span></p>\n<p></p>\n<p><strong>一、广告内容需遵循《广告法》及相关法律、法规规定</strong></p>\n<p></p>\n<p><strong>角色说明简介：</strong></p>\n<p>1.广告主：是指为推销商品或者服务，自行或者委托他人设计、制作、发布广告的自然人、法人或者其他组织。</p>\n<p>2.广告经营者：是指接受委托提供广告设计、制作、代理服务的自然人、法人或者其他组织。</p>\n<p>3.广告发布者：是指为广告主或者广告主委托的广告经营者发布广告的自然人、法人或者其他组织。</p>\n<p>4.广告代言人：是指广告主以外的，在广告中以自己的名义或者形象对商品、服务作推荐、证明的自然人、法人或者其他组织。</p>\n<p></p>\n<p><strong>广告内容基础准则：</strong></p>\n<p>1.广告应当真实、合法，符合法律法规与社会主义价值观，不得含有虚假的内容，不得欺骗和误导消费者。</p>\n<p>2.广告中对商品的性能、功能、产地、用途、质量、成分、价格、生产者、有效期限、允诺等或者对服务的内容、提供者、形式、质量、价格、允诺等有表示的，应当准确、清楚、明白。 广告中表明推销的商品或者服务附带赠送的，应当明示所附带赠送商品或者服务的品种、规格、数量、期限和方式。 法律、行政法规规定广告中应当明示的内容，应当显著、清晰表示。</p>\n<p>3.广告内容涉及的事项需要取得行政许可的，应当与许可的内容相符合。 广告使用数据、统计资料、调查结果、文摘、引用语等引证内容的，应当真实、准确，并表明出处（引证内容需要为有公信力的国家官方机构，不得为民间组织或个人）。引证内容有适用范围和有效期限的，应当明确表示。</p>\n<p>4.广告中涉及专利产品或者专利方法的，应当标明专利号和专利种类。 未取得专利权的，不得在广告中谎称取得专利权。 禁止使用未授予专利权的专利申请和已经终止、撤销、无效的专利作广告。</p>\n<p></p>\n<p><strong>二、广告不得存在如下情形</strong></p>\n<p></p>\n<p>1、使用或者变相使用中华人民共和国的国旗、国歌、国徽，军旗、军歌、军徽；</p>\n<p>2、使用或者变相使用任何国家的国家机关、国家机关工作人员的名义或者形象；</p>\n<p>3、使用“国家级”、“最高级”、“最佳”等绝对化用语；</p>\n<p>4、损害国家的尊严或者利益，泄露国家秘密；</p>\n<p>5、使用流通货币用作商业推广；</p>\n<p>6、妨碍社会安定，损害社会公共利益；</p>\n<p>7、危害人身、财产安全，泄露个人隐私；</p>\n<p>8、妨碍社会公共秩序或者违背社会良好风尚；</p>\n<p>9、含有淫秽、色情、赌博、迷信、恐怖、暴力的内容；</p>\n<p>10、含有民族、种族、宗教、性别歧视的内容；</p>\n<p>11、妨碍环境、自然资源或者文化遗产保护；</p>\n<p>12、涉及名人无授权或违反广告代言规则；</p>\n<p>13、涉及央视等媒体无授权，如央视合作伙伴；</p>\n<p>14、涉及商标无授权或使用驰名商标；</p>\n<p>15、涉及知识产权侵权，如作品抄袭；</p>\n<p>16、使用专家推荐的违禁词汇，无授权证明使用明星推荐；</p>\n<p>17、有奖销售最高奖的金额超过五万元；</p>\n<p>18、歪曲、丑化、亵渎、否定英雄烈士事迹和精神；</p>\n<p>19、损害未成年人和残疾人的身心健康或贬低他人的；</p>\n<p>20、贬低其他生产经营者的商品或者服务；</p>\n<p>21、投放虚假或引人误解的广告；</p>\n<p>22、法律、行政法规规定禁止的其他情形；</p>\n<p><span style=\"color: rgb(208,2,27);\">注：若使用中国地图，须使用经国家测绘部门审批通过且标明“审图号”的地图，并在地图或附着地图图形的素材上显著标注审图号；国界必须清晰，无论陆地还是海洋，都必须清楚标明国界线，且完整显示南海诸岛等；依国家规定称呼港澳台，不得与其他主权国家并列</span></p>\n<p></p>\n<p></p>\n<p></p>\n<p><span style=\"font-size: 16px;\"><strong>［3］不同行业审核规范</strong></span></p>\n<p></p>\n<p><strong>一、关于医疗、药品、保健食品、特殊医学用途配方食品、医疗器械、兽药、医疗机构类推广基本策略</strong></p>\n<p></p>\n<p>1、视频封面以及视频中涉及对商品、服务进行描述、使用的，应当提供相应的广审文件；且广审内容应当与视频内容相一致（广审内容不得自行修改或拼接）</p>\n<p></p>\n<p><strong>二、关于医疗、药品、保健食品、特殊医学用途配方食品、医疗器械、兽药、医疗机构类推广基本审核规范</strong></p>\n<p></p>\n<p>1、药品、医疗器械、特殊医学用途配方食品、保健食品广告应当显著标明广告批准文号。</p>\n<p>2、药品、医疗器械、特殊医学用途配方食品、保健食品广告中应当显著标明的内容，其字体和颜色必须清晰可见、易于辨认，在视频广告中应当持续显示\t</p>\n<p>3、医疗、药品、医疗器械、特殊医学用途配方食品、保健食品广告不得含有下列内容：&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;1）违反科学规律，明示或者暗示可以治疗所有疾病、适应所有症状、适应所有人群，或者正常生活和治疗病症所必需等内容（如包治百病、治一个好一个、根治、痊愈）等承诺性用语；</p>\n<p>&nbsp;&nbsp;&nbsp;2）表示功效的断言，如说明治愈率或者有效率（如康复率达到98%）；&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;3）引起公众对所处健康状况和所患疾病产生不必要的担忧和恐惧，或者使公众误解不使用该产品会患某种疾病或者加重病情的内容；</p>\n<p>&nbsp;&nbsp;&nbsp;4）含有“安全”“安全无毒副作用”“毒副作用小”；明示或者暗示成分为“天然”，因而安全性有保证等内容；</p>\n<p>&nbsp;&nbsp;&nbsp;5）含有医疗机构的名称、地址、联系方式、诊疗项目、诊疗方法以及有关义诊、医疗咨询电话、开设特约门诊等医疗服务的内容;</p>\n<p>&nbsp;&nbsp;&nbsp;6）与其他药品、医疗器械的功效和安全性或者其他医疗机构比较；&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;7）利用广告代言人或专家、患者的名义做作推荐、证明；&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;8）含有评比、排序、推荐、指定、选用、获奖等综合性评价内容；</p>\n<p>&nbsp;&nbsp;&nbsp;9）涉及医疗技术、诊疗方法、疾病名称、药物的（如细胞治疗、乙型肝炎）；</p>\n<p>&nbsp;&nbsp;&nbsp;10）含有无法证实其科学性的所谓“研究发现”、“实验或数据证明”等方面的内容；</p>\n<p>&nbsp;&nbsp;&nbsp;11）明示或暗示该产品为正常生活和治疗病症所必需等内容，如“家庭必备”或类似内容；</p>\n<p>&nbsp;&nbsp;&nbsp;12）明示或暗示该产品能应付现代紧张生活和升学、考试等需要，能够帮助提高成绩、使精力旺盛、增强竞争力、增高、益智等内容；</p>\n<p>&nbsp;&nbsp;&nbsp;13）含有涉及公共信息、公共事件或其他与公共利益相关联的内容，如各类疾病信息、经济社会发展成果或医疗科学以外的科技\t</p>\n<p>&nbsp;&nbsp;&nbsp;14）以介绍健康、养生知识等形式变相发布药品、医疗器械、特殊医学用途配方食品；</p>\n<p>&nbsp;&nbsp;&nbsp;15）涉及推广单个医疗项目；</p>\n<p>&nbsp;&nbsp;&nbsp;16）法律、行政法规规定禁止的其他内容。</p>\n<p>4、广告中应当显著标明“禁忌内容或者注意事项详见说明书”，并应当显著标明禁忌、不良反应，且不得与监督管理部门批准的说明书不一致。</p>\n<p>5、除医疗、药品、医疗器械广告，禁止其他任何广告涉及疾病治疗功能，并不得使用医疗用语或者易使推销的商品与药品、医疗器械相混淆的用语。</p>\n<p></p>\n<p>（一）医疗器械类广告</p>\n<p></p>\n<p>1、不得以任何非医疗器械产品名称代替医疗器械产品名称进行宣传</p>\n<p>2、不得以儿童为诉求对象，不得以儿童的名义介绍医疗器械</p>\n<p>3、不得含有不科学的表述或者使用不恰当的表现形式，引起公众对所处健康状况和所患疾病产生不必要的担忧和恐惧，或者使公众误解不使用该产品会患某种疾病或加重病情</p>\n<p>4、不得含有表述该产品处于“热销”、“抢购”、“试用”等内容</p>\n<p></p>\n<p>（二）OTC药品</p>\n<p></p>\n<p>1、药品广告不得以儿童为诉求对象</p>\n<p>1）不得以儿童的形象（含儿童卡通形象）或儿童的声音（含模仿儿童的声音）介绍药品</p>\n<p>2）不得直接向儿童（含儿童卡通形象）宣传、介绍药品</p>\n<p></p>\n<p>（三）医疗机构</p>\n<p></p>\n<p>1、若为医疗机构推广仅允许发布：第一名称；医疗机构地址；所有制形式；医疗机构类别；诊疗科目；床位数；接诊时间；联系电话</p>\n<p>2、若为医美类型的医疗机构的项目推广，仅允许发布轻医美相关项目（如：小气泡、补水护肤等）或部分重医美相关项目（如：激光、三针等）</p>\n<p></p>\n<p>（四）宠物医院</p>\n<p></p>\n<p>1、诊所宣传禁止离居民楼、幼儿园、学校、超市、农贸市场等人流密集区 15 米以内（参考《中华人民共和国动物防疫法十九条》）&nbsp;</p>\n<p>2、禁止宣传在居民小区、机关、企事业单位等场所内院从事动物诊疗活动（参考《中华人民共和国动物防疫法十九条）</p>\n<p>3、禁止出现无痛、安全、保证等虚假宣传</p>\n<p>4、不得涉及售卖兽药</p>\n<p></p>\n<p>（五）保健食品</p>\n<p></p>\n<p>广告应当显著标明“保健食品不是药物，不能代替药物治疗疾病”，声明本品不能代替药物，并显著标明保健食品标志（保健食品的蓝帽标识）、适宜人群和不适宜人群。</p>\n<p></p>\n<p>（六）农药、兽药、饲料和饲料添加剂类</p>\n<p></p>\n<p>1、兽药、饲料和饲料添加剂广告不得含有下列内容：&nbsp;</p>\n<p>1）表示功效、安全性的断言或者保证；&nbsp;</p>\n<p>2）利用科研单位、学术机构、技术推广机构、行业协会或者专业人士、用户的名义或者形象作推荐、证明；&nbsp;</p>\n<p>3）说明有效率；&nbsp;</p>\n<p>4）违反安全使用规程的文字、语言或者画面；&nbsp;</p>\n<p>5）法律、行政法规规定禁止的其他内容。</p>\n<p></p>\n<p><strong>三、关于美容化妆类推广基本审核规范</strong></p>\n<p></p>\n<p>1、不得使用他人名义保证或者以暗示方法使人误解其效用。</p>\n<p>2、不得宣传医疗作用或者使用医疗术语。</p>\n<p>3、普通美容院不得涉及手术开刀等项目（凡有伤口即认定为手术），或其他医疗器械以及其他具有创伤性或侵入性的医学技术方法进行修复与再塑的项目。</p>\n<p>4、口红、眼影类化妆品不可涉及试色图侵权：著名博主试色图、带博主logo的试色图禁止使用。</p>\n<p>5、化妆品广告不得包含承诺行描述，如根治、治愈。</p>\n<p>6、普通美容院仅可推广品牌向内容，不得涉及单个项目推广</p>\n<p>7、不得使用患者形象或患者病理图（即患处放大图）</p>\n<p>8、美妆类广告不得进行前后对比展示来凸显效果</p>\n<p></p>\n<p><strong>四、关于金融类推广基本审核规范</strong></p>\n<p></p>\n<p>1、招商等有投资回报预期的商品或者服务广告，应当对可能存在的风险以及风险责任承担有合理提示或者警示（如投资有风险，理财需谨慎），并不得含有下列内容：&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;1）对未来效果、收益或者与其相关的情况作出保证性承诺，明示或者暗示保本、无风险或者保收益等</p>\n<p>&nbsp;&nbsp;&nbsp;2）利用学术机构、行业协会、专业人士、受益者的名义或者形象作推荐、证明。</p>\n<p>&nbsp;&nbsp;&nbsp;3）禁止导流到QQ群或微信号等社交工具，不得含有“免费加群”“微信群号”等引导用户加群的话术</p>\n<p>2、银行类广告还需遵循如下规定：</p>\n<p>&nbsp;&nbsp;&nbsp;1）信用卡业务广告不得涉及承诺信额\t</p>\n<p>&nbsp;&nbsp;&nbsp;2）不得使用用手机号、指纹等非常规办卡形式的描述</p>\n<p>&nbsp;&nbsp;&nbsp;3）禁止使用偶发性内容作为推广噱头，如“三秒下卡”等，需提供相关证明</p>\n<p>&nbsp;&nbsp;&nbsp;4）信用卡额度申请额度达5万以上时候，需提供银行相关额度证明，并在稿件中标注【根据申请人条件不同，最终额度会有不同】的提示语。</p>\n<p>3、股票类广告还需遵循如下规定：</p>\n<p>&nbsp;&nbsp;&nbsp;1）广告不得涉及单个个股推荐，包括出现具体股票代码、名称</p>\n<p>&nbsp;&nbsp;&nbsp;2）不得出现“配资炒股”、“借钱炒股”、“股票配资”等内容</p>\n<p>&nbsp;&nbsp;&nbsp;3）股票不得涉及“揭秘”、“泄露机密”、“内部消息”等暗示诱导的描述</p>\n<p>&nbsp;&nbsp;&nbsp;4）不得直接使用真实K线截图作为广告素材或使用某一支股票的K线图。虚拟K线图不得带有暗示股票上涨的设计。</p>\n<p>4、汽车金融类广告还需遵循如下规定：</p>\n<p>&nbsp;&nbsp;&nbsp;1）不得出现0首付的业务推广\t</p>\n<p>&nbsp;&nbsp;&nbsp;2）汽车类广告中出现具体机构贷款服务需要补充跟金融机构的合作协议，并在广告中说明相关金融业务和活动介绍</p>\n<p>&nbsp;&nbsp;&nbsp;3）如是涉及商家自身业务补贴优惠活动，需在广告中说明详细活动内容并引导到店了解</p>\n<p>5、贷款类广告还需遵循如下规定：</p>\n<p>&nbsp;&nbsp;&nbsp;1）贷款广告不得使用 “0门槛”的描述，不可是用仅凭身份证即可贷款、不看征信可贷款等描述</p>\n<p>&nbsp;&nbsp;&nbsp;2）禁止出现还款无压力、轻松还款等描述</p>\n<p>&nbsp;&nbsp;&nbsp;3）不得使用诱导性贷款描述（如欠款太多还补上、逾期不可怕）</p>\n<p>&nbsp;&nbsp;&nbsp;4）不得投放针对学生，高校客群的贷款产品</p>\n<p>&nbsp;&nbsp;&nbsp;5）不得出现以下词语：身份证即可办理、砍头息、0 利息、无息、包批、包下款、不看征信、黑户、担保无抵押、秒借、0 风险、高收益、高回报等不符合实际的描述</p>\n<p>&nbsp;&nbsp;&nbsp;6）在使用日费率、月费率的同时，需要在稿件中标注年化费率，且符合费率区间，累计利率不得超过24%（借贷双方约定的利率未超过年利率24%，出借人有请求借款人按照约定的利率支付利息）</p>\n<p>&nbsp;&nbsp;&nbsp;7）不得含有超前消费、过度消费和从众消费等错误观念内容</p>\n<p></p>\n<p><strong>五、关于酒类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>酒类广告不得含有下列内容：</strong>&nbsp;</p>\n<p>&nbsp;1）诱导、怂恿饮酒或者宣传无节制饮酒；&nbsp;</p>\n<p>&nbsp;2）出现饮酒的动作（如：举起酒杯，或举杯朝嘴部的相似动作、劝酒/灌酒等动作）；</p>\n<p>&nbsp;3）表现驾驶车、船、飞机等活动；&nbsp;</p>\n<p>&nbsp;4）明示或者暗示饮酒有消除紧张和焦虑、增加体力等功效。</p>\n<p>&nbsp;5）含有未成年人的形象（包含未成年人的卡通形象）</p>\n<p>&nbsp;6）使用医疗用语或者易与药品混淆的用语</p>\n<p></p>\n<p><strong>六、关于母婴类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>母婴食品类广告不得含有下列内容：</strong></p>\n<p>&nbsp;1）不得明示或者暗示可以替代母乳，不得使用母乳哺乳中的妇女和婴儿的形象</p>\n<p>&nbsp;2）不得对0-12个月婴儿食用的奶粉进行广告宣传</p>\n<p>&nbsp;3）不得使用进口奶源、源自国外牧场、生态牧场、进口原料”等模糊信息； 涉及原料来源的（如生乳、原料乳粉等原料来源），应当如实标明具体来源地或者来源； 如：新西兰进口奶源、源自澳大利亚牧场等</p>\n<p>&nbsp;4）不得明示或者暗示具有益智、增加抵抗力或者免疫力、保护肠道等功能性表述。不得对于按照食品安全标准不应当在产品配方中含有或者使用的物质，以“不添加”“不含有”“零添加”等字样强调未使用或者不含有</p>\n<p></p>\n<p><strong>七、关于征婚交友类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>征婚交友广告不得含有下列内容：</strong></p>\n<p>&nbsp;1）婚恋交友行业广告出现有歧义、淫秽、隐晦、擦边等内容；&nbsp;</p>\n<p>&nbsp;2）出现夕阳红、二婚等内容；&nbsp;</p>\n<p>&nbsp;3）出现分离小三、婚姻破裂等</p>\n<p></p>\n<p><strong>八、关于招聘类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>招聘广告不得含有下列内容：</strong></p>\n<p>&nbsp;1）稿件上职位不得与实际推荐职位不一致；&nbsp;</p>\n<p>&nbsp;2）稿件以及落地必须为开户通过审核的产品平台，不得跳转至其他招聘平台；</p>\n<p>&nbsp;3）广告素材内提及工作薪资，须在稿件内体现或提供相关证明；&nbsp;</p>\n<p>&nbsp;4）出现工作职能描述不清的职业；</p>\n<p>&nbsp;5）出现工作描述仅为：在家躺着也能赚钱、一部手机就能赚钱等</p>\n<p>&nbsp;6）出现低俗擦边职业描述：学生妹晚上去赚点零花钱等</p>\n<p>&nbsp;7）出现打字员、刷单、涨粉、刷评论等职位</p>\n<p></p>\n<p><strong>九、关于教育类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>教育培训类广告不得含有下列内容：</strong></p>\n<p>&nbsp;1）对升学、通过考试、获得学位学历或者合格证书，或者对教育、培训的效果作出明示或者暗示的保证性承诺，如包过、百分百通过、保过、100%通过、包通过、保通过、免考拿本科、免学等承诺性描述</p>\n<p>&nbsp;2）明示或者暗示有相关考试机构或者其工作人员、考试命题人员参与教育、培训</p>\n<p>&nbsp;3）利用科研单位、学术机构、教育机构、行业协会、专业人士、受益者的名义或者形象作推荐、证明</p>\n<p>&nbsp;4）非学位授予单位不得声称可以授予学位</p>\n<p>&nbsp;5）以新闻报道的形式或以“国家发布新规”、“教育改革”等虚假信息做宣传，误导消费者</p>\n<p>&nbsp;6）涉及虚假宣传，使用“奖学金”、“高薪、高收入”等为噱头诱导用户点击</p>\n<p>&nbsp;7）金融类课程：涉及单个理财项目，个人教师项目，暗示成效（如：学了之后能赚大钱）</p>\n<p>&nbsp;8）医疗类课程：涉及失传秘方教育，明示医疗成效等</p>\n<p>&nbsp;9）涉及宣导学习某一技术/技能为由，不上大学、不上高中等</p>\n<p>&nbsp;10）涉及K12阶段的任意培训辅导等（需管控教育阶段：幼儿园、小学、初中、高中；学科类课外培训：语文、数学、外语、物理、化学、地理、政治、历史、生物等应试范围的基础学科类培训）</p>\n<p>&nbsp;11）普通组织机构不得在广告中使用“大学”“学院”字样（除经批准设立的大学、学院以及由其设立的内部机构或由其发起并依法登记的组织机构外）</p>\n<p></p>\n<p><strong>十、关于电商类推广基本审核规范</strong></p>\n<p></p>\n<p>1、广告应当真实、合法，以健康的表现形式表达广告内容</p>\n<p>不得对商品的性能、功能、产地、用途、质量、成分、价格、生产者、有效期限等进行夸大或承诺性描述</p>\n<p>2、若广告商品满足下述条件，还需提供相关正品证明</p>\n<p>&nbsp;1）奢侈品、知名品牌（包括但不限于鞋、包、表、手机、相机等）</p>\n<p>&nbsp;2）数码3C折扣低于5折（含5折）；其他类别折扣低于3折（含3折）</p>\n<p>3、若广告内容含有优惠活动信息，则需在广告显著位置进行说明，包括：</p>\n<p>1）在稿件上进行明示（如限时秒杀活动），且不可将活动价作为正常价格展示，以致误导用户，构成虚假宣传</p>\n<p>2）稿件所描述活动细则需与实际活动描述一致，</p>\n<p>3）若稿件上有活动，实际导向活动无细则，还需要额外提供活动证明</p>\n<p></p>\n<p><strong>十一、关于普通食品类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>普通食品广告不得含有下列内容：</strong></p>\n<p>&nbsp;1）不得含有“纯天然”等虚假描述（注：只要是经过人工培育，无论是否为天然长成均不属于”纯天然“）</p>\n<p>&nbsp;2）不得单纯描述无添加食品，文案中需标记注释无添加元素（如：不添加香精防腐剂）</p>\n<p>&nbsp;3）金银箔粉不属于食品添加剂，不能用于食品生产经营。不得发布以金银箔粉作为食品原料或者食品添加剂生产的食品广告（含国产和进口食品），不得发布经营可食用金银箔粉的广告</p>\n<p>&nbsp;4）不得发布以食品添加金银箔粉（含）为噱头宣扬奢靡享乐、拜金主义等违背社会良好风尚的广告</p>\n<p>&nbsp;5）食品广告中不得明示或者暗示金银箔粉可食用，也不得借助食品添加金银箔粉宣传具有保健功能、治疗功效等特殊功效</p>\n<p></p>\n<p></p>\n<p></p>\n<p></p>\n<p></p>\n<p></p>\n"},"headTitle":"","lineHeight":26,"_asyncData":{}},"framework":"vanilla","source":"library","boxConfig":{"spaceTop":0,"spaceBottom":0,"spaceLeft":0,"spaceRight":0,"width":750,"paddingLeft":"3px","isFirstScreen":true},"values":{"diableRemParse":true,"htmlObj":{"dangerHtml":"<p style=\"text-align:left;\"></p>\n<p></p>\n<p style=\"text-align:center;\"><span style=\"font-size: 24px;\">花火商单视频审核管理规范</span></p>\n<p></p>\n<p></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;商业广告视频是指，在视频内容中含有对某商品、服务进行有偿推广行为的视频。由于商单视频制作主体为up主，且初上线群体为up主粉丝，故在视频上的纯内容侧遵循创作公约，广告侧应当严格遵守广告法。</p>\n<p></p>\n<p><strong>序言：</strong></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;商业广告视频审核基本规范</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;1、商业广告视频审核重点关注对商品、服务进行推广表达的标题、封面、描述、视频等内容。</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2、广告应当同时遵守《广告法》等法律、法规的基本规定以及平台审核、设计规范。</p>\n<p></p>\n<p></p>\n<p><strong>商单视频与推广规范：</strong></p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;［1］行业准入规定</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;［2］基本注意事项</p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;［3］不同行业审核规范</p>\n<p></p>\n<p></p>\n<p></p>\n<p><span style=\"font-size: 16px;\"><strong>［1］行业准入规定</strong></span></p>\n<p></p>\n<img src=\"https://i0.hdslb.com/bfs/activity-plat/static/e2080d153bdf4de08d62649fad2c59be/99yyK4Z49N_w1194_h422.png\" alt=\"\" style=\"height: 140px;width: 400px\"/>\n<p><span style=\"color: rgb(208,2,27);\">注：由于金融服务、计生用品、医疗仅可通过官方资质认证后准入，若未通过资质认证的客户稿件选择其他可准入行业逃避审查，一经发现，将以驳回处理</span></p>\n<p></p>\n<p></p>\n<p></p>\n<p><span style=\"font-size: 16px;\"><strong>［2］基本注意事项</strong></span></p>\n<p></p>\n<p><strong>一、广告内容需遵循《广告法》及相关法律、法规规定</strong></p>\n<p></p>\n<p><strong>角色说明简介：</strong></p>\n<p>1.广告主：是指为推销商品或者服务，自行或者委托他人设计、制作、发布广告的自然人、法人或者其他组织。</p>\n<p>2.广告经营者：是指接受委托提供广告设计、制作、代理服务的自然人、法人或者其他组织。</p>\n<p>3.广告发布者：是指为广告主或者广告主委托的广告经营者发布广告的自然人、法人或者其他组织。</p>\n<p>4.广告代言人：是指广告主以外的，在广告中以自己的名义或者形象对商品、服务作推荐、证明的自然人、法人或者其他组织。</p>\n<p></p>\n<p><strong>广告内容基础准则：</strong></p>\n<p>1.广告应当真实、合法，符合法律法规与社会主义价值观，不得含有虚假的内容，不得欺骗和误导消费者。</p>\n<p>2.广告中对商品的性能、功能、产地、用途、质量、成分、价格、生产者、有效期限、允诺等或者对服务的内容、提供者、形式、质量、价格、允诺等有表示的，应当准确、清楚、明白。 广告中表明推销的商品或者服务附带赠送的，应当明示所附带赠送商品或者服务的品种、规格、数量、期限和方式。 法律、行政法规规定广告中应当明示的内容，应当显著、清晰表示。</p>\n<p>3.广告内容涉及的事项需要取得行政许可的，应当与许可的内容相符合。 广告使用数据、统计资料、调查结果、文摘、引用语等引证内容的，应当真实、准确，并表明出处（引证内容需要为有公信力的国家官方机构，不得为民间组织或个人）。引证内容有适用范围和有效期限的，应当明确表示。</p>\n<p>4.广告中涉及专利产品或者专利方法的，应当标明专利号和专利种类。 未取得专利权的，不得在广告中谎称取得专利权。 禁止使用未授予专利权的专利申请和已经终止、撤销、无效的专利作广告。</p>\n<p></p>\n<p><strong>二、广告不得存在如下情形</strong></p>\n<p></p>\n<p>1、使用或者变相使用中华人民共和国的国旗、国歌、国徽，军旗、军歌、军徽；</p>\n<p>2、使用或者变相使用任何国家的国家机关、国家机关工作人员的名义或者形象；</p>\n<p>3、使用“国家级”、“最高级”、“最佳”等绝对化用语；</p>\n<p>4、损害国家的尊严或者利益，泄露国家秘密；</p>\n<p>5、使用流通货币用作商业推广；</p>\n<p>6、妨碍社会安定，损害社会公共利益；</p>\n<p>7、危害人身、财产安全，泄露个人隐私；</p>\n<p>8、妨碍社会公共秩序或者违背社会良好风尚；</p>\n<p>9、含有淫秽、色情、赌博、迷信、恐怖、暴力的内容；</p>\n<p>10、含有民族、种族、宗教、性别歧视的内容；</p>\n<p>11、妨碍环境、自然资源或者文化遗产保护；</p>\n<p>12、涉及名人无授权或违反广告代言规则；</p>\n<p>13、涉及央视等媒体无授权，如央视合作伙伴；</p>\n<p>14、涉及商标无授权或使用驰名商标；</p>\n<p>15、涉及知识产权侵权，如作品抄袭；</p>\n<p>16、使用专家推荐的违禁词汇，无授权证明使用明星推荐；</p>\n<p>17、有奖销售最高奖的金额超过五万元；</p>\n<p>18、歪曲、丑化、亵渎、否定英雄烈士事迹和精神；</p>\n<p>19、损害未成年人和残疾人的身心健康或贬低他人的；</p>\n<p>20、贬低其他生产经营者的商品或者服务；</p>\n<p>21、投放虚假或引人误解的广告；</p>\n<p>22、法律、行政法规规定禁止的其他情形；</p>\n<p><span style=\"color: rgb(208,2,27);\">注：若使用中国地图，须使用经国家测绘部门审批通过且标明“审图号”的地图，并在地图或附着地图图形的素材上显著标注审图号；国界必须清晰，无论陆地还是海洋，都必须清楚标明国界线，且完整显示南海诸岛等；依国家规定称呼港澳台，不得与其他主权国家并列</span></p>\n<p></p>\n<p></p>\n<p></p>\n<p><span style=\"font-size: 16px;\"><strong>［3］不同行业审核规范</strong></span></p>\n<p></p>\n<p><strong>一、关于医疗、药品、保健食品、特殊医学用途配方食品、医疗器械、兽药、医疗机构类推广基本策略</strong></p>\n<p></p>\n<p>1、视频封面以及视频中涉及对商品、服务进行描述、使用的，应当提供相应的广审文件；且广审内容应当与视频内容相一致（广审内容不得自行修改或拼接）</p>\n<p></p>\n<p><strong>二、关于医疗、药品、保健食品、特殊医学用途配方食品、医疗器械、兽药、医疗机构类推广基本审核规范</strong></p>\n<p></p>\n<p>1、药品、医疗器械、特殊医学用途配方食品、保健食品广告应当显著标明广告批准文号。</p>\n<p>2、药品、医疗器械、特殊医学用途配方食品、保健食品广告中应当显著标明的内容，其字体和颜色必须清晰可见、易于辨认，在视频广告中应当持续显示\t</p>\n<p>3、医疗、药品、医疗器械、特殊医学用途配方食品、保健食品广告不得含有下列内容：&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;1）违反科学规律，明示或者暗示可以治疗所有疾病、适应所有症状、适应所有人群，或者正常生活和治疗病症所必需等内容（如包治百病、治一个好一个、根治、痊愈）等承诺性用语；</p>\n<p>&nbsp;&nbsp;&nbsp;2）表示功效的断言，如说明治愈率或者有效率（如康复率达到98%）；&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;3）引起公众对所处健康状况和所患疾病产生不必要的担忧和恐惧，或者使公众误解不使用该产品会患某种疾病或者加重病情的内容；</p>\n<p>&nbsp;&nbsp;&nbsp;4）含有“安全”“安全无毒副作用”“毒副作用小”；明示或者暗示成分为“天然”，因而安全性有保证等内容；</p>\n<p>&nbsp;&nbsp;&nbsp;5）含有医疗机构的名称、地址、联系方式、诊疗项目、诊疗方法以及有关义诊、医疗咨询电话、开设特约门诊等医疗服务的内容;</p>\n<p>&nbsp;&nbsp;&nbsp;6）与其他药品、医疗器械的功效和安全性或者其他医疗机构比较；&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;7）利用广告代言人或专家、患者的名义做作推荐、证明；&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;8）含有评比、排序、推荐、指定、选用、获奖等综合性评价内容；</p>\n<p>&nbsp;&nbsp;&nbsp;9）涉及医疗技术、诊疗方法、疾病名称、药物的（如细胞治疗、乙型肝炎）；</p>\n<p>&nbsp;&nbsp;&nbsp;10）含有无法证实其科学性的所谓“研究发现”、“实验或数据证明”等方面的内容；</p>\n<p>&nbsp;&nbsp;&nbsp;11）明示或暗示该产品为正常生活和治疗病症所必需等内容，如“家庭必备”或类似内容；</p>\n<p>&nbsp;&nbsp;&nbsp;12）明示或暗示该产品能应付现代紧张生活和升学、考试等需要，能够帮助提高成绩、使精力旺盛、增强竞争力、增高、益智等内容；</p>\n<p>&nbsp;&nbsp;&nbsp;13）含有涉及公共信息、公共事件或其他与公共利益相关联的内容，如各类疾病信息、经济社会发展成果或医疗科学以外的科技\t</p>\n<p>&nbsp;&nbsp;&nbsp;14）以介绍健康、养生知识等形式变相发布药品、医疗器械、特殊医学用途配方食品；</p>\n<p>&nbsp;&nbsp;&nbsp;15）涉及推广单个医疗项目；</p>\n<p>&nbsp;&nbsp;&nbsp;16）法律、行政法规规定禁止的其他内容。</p>\n<p>4、广告中应当显著标明“禁忌内容或者注意事项详见说明书”，并应当显著标明禁忌、不良反应，且不得与监督管理部门批准的说明书不一致。</p>\n<p>5、除医疗、药品、医疗器械广告，禁止其他任何广告涉及疾病治疗功能，并不得使用医疗用语或者易使推销的商品与药品、医疗器械相混淆的用语。</p>\n<p></p>\n<p>（一）医疗器械类广告</p>\n<p></p>\n<p>1、不得以任何非医疗器械产品名称代替医疗器械产品名称进行宣传</p>\n<p>2、不得以儿童为诉求对象，不得以儿童的名义介绍医疗器械</p>\n<p>3、不得含有不科学的表述或者使用不恰当的表现形式，引起公众对所处健康状况和所患疾病产生不必要的担忧和恐惧，或者使公众误解不使用该产品会患某种疾病或加重病情</p>\n<p>4、不得含有表述该产品处于“热销”、“抢购”、“试用”等内容</p>\n<p></p>\n<p>（二）OTC药品</p>\n<p></p>\n<p>1、药品广告不得以儿童为诉求对象</p>\n<p>1）不得以儿童的形象（含儿童卡通形象）或儿童的声音（含模仿儿童的声音）介绍药品</p>\n<p>2）不得直接向儿童（含儿童卡通形象）宣传、介绍药品</p>\n<p></p>\n<p>（三）医疗机构</p>\n<p></p>\n<p>1、若为医疗机构推广仅允许发布：第一名称；医疗机构地址；所有制形式；医疗机构类别；诊疗科目；床位数；接诊时间；联系电话</p>\n<p>2、若为医美类型的医疗机构的项目推广，仅允许发布轻医美相关项目（如：小气泡、补水护肤等）或部分重医美相关项目（如：激光、三针等）</p>\n<p></p>\n<p>（四）宠物医院</p>\n<p></p>\n<p>1、诊所宣传禁止离居民楼、幼儿园、学校、超市、农贸市场等人流密集区 15 米以内（参考《中华人民共和国动物防疫法十九条》）&nbsp;</p>\n<p>2、禁止宣传在居民小区、机关、企事业单位等场所内院从事动物诊疗活动（参考《中华人民共和国动物防疫法十九条）</p>\n<p>3、禁止出现无痛、安全、保证等虚假宣传</p>\n<p>4、不得涉及售卖兽药</p>\n<p></p>\n<p>（五）保健食品</p>\n<p></p>\n<p>广告应当显著标明“保健食品不是药物，不能代替药物治疗疾病”，声明本品不能代替药物，并显著标明保健食品标志（保健食品的蓝帽标识）、适宜人群和不适宜人群。</p>\n<p></p>\n<p>（六）农药、兽药、饲料和饲料添加剂类</p>\n<p></p>\n<p>1、兽药、饲料和饲料添加剂广告不得含有下列内容：&nbsp;</p>\n<p>1）表示功效、安全性的断言或者保证；&nbsp;</p>\n<p>2）利用科研单位、学术机构、技术推广机构、行业协会或者专业人士、用户的名义或者形象作推荐、证明；&nbsp;</p>\n<p>3）说明有效率；&nbsp;</p>\n<p>4）违反安全使用规程的文字、语言或者画面；&nbsp;</p>\n<p>5）法律、行政法规规定禁止的其他内容。</p>\n<p></p>\n<p><strong>三、关于美容化妆类推广基本审核规范</strong></p>\n<p></p>\n<p>1、不得使用他人名义保证或者以暗示方法使人误解其效用。</p>\n<p>2、不得宣传医疗作用或者使用医疗术语。</p>\n<p>3、普通美容院不得涉及手术开刀等项目（凡有伤口即认定为手术），或其他医疗器械以及其他具有创伤性或侵入性的医学技术方法进行修复与再塑的项目。</p>\n<p>4、口红、眼影类化妆品不可涉及试色图侵权：著名博主试色图、带博主logo的试色图禁止使用。</p>\n<p>5、化妆品广告不得包含承诺行描述，如根治、治愈。</p>\n<p>6、普通美容院仅可推广品牌向内容，不得涉及单个项目推广</p>\n<p>7、不得使用患者形象或患者病理图（即患处放大图）</p>\n<p>8、美妆类广告不得进行前后对比展示来凸显效果</p>\n<p></p>\n<p><strong>四、关于金融类推广基本审核规范</strong></p>\n<p></p>\n<p>1、招商等有投资回报预期的商品或者服务广告，应当对可能存在的风险以及风险责任承担有合理提示或者警示（如投资有风险，理财需谨慎），并不得含有下列内容：&nbsp;</p>\n<p>&nbsp;&nbsp;&nbsp;1）对未来效果、收益或者与其相关的情况作出保证性承诺，明示或者暗示保本、无风险或者保收益等</p>\n<p>&nbsp;&nbsp;&nbsp;2）利用学术机构、行业协会、专业人士、受益者的名义或者形象作推荐、证明。</p>\n<p>&nbsp;&nbsp;&nbsp;3）禁止导流到QQ群或微信号等社交工具，不得含有“免费加群”“微信群号”等引导用户加群的话术</p>\n<p>2、银行类广告还需遵循如下规定：</p>\n<p>&nbsp;&nbsp;&nbsp;1）信用卡业务广告不得涉及承诺信额\t</p>\n<p>&nbsp;&nbsp;&nbsp;2）不得使用用手机号、指纹等非常规办卡形式的描述</p>\n<p>&nbsp;&nbsp;&nbsp;3）禁止使用偶发性内容作为推广噱头，如“三秒下卡”等，需提供相关证明</p>\n<p>&nbsp;&nbsp;&nbsp;4）信用卡额度申请额度达5万以上时候，需提供银行相关额度证明，并在稿件中标注【根据申请人条件不同，最终额度会有不同】的提示语。</p>\n<p>3、股票类广告还需遵循如下规定：</p>\n<p>&nbsp;&nbsp;&nbsp;1）广告不得涉及单个个股推荐，包括出现具体股票代码、名称</p>\n<p>&nbsp;&nbsp;&nbsp;2）不得出现“配资炒股”、“借钱炒股”、“股票配资”等内容</p>\n<p>&nbsp;&nbsp;&nbsp;3）股票不得涉及“揭秘”、“泄露机密”、“内部消息”等暗示诱导的描述</p>\n<p>&nbsp;&nbsp;&nbsp;4）不得直接使用真实K线截图作为广告素材或使用某一支股票的K线图。虚拟K线图不得带有暗示股票上涨的设计。</p>\n<p>4、汽车金融类广告还需遵循如下规定：</p>\n<p>&nbsp;&nbsp;&nbsp;1）不得出现0首付的业务推广\t</p>\n<p>&nbsp;&nbsp;&nbsp;2）汽车类广告中出现具体机构贷款服务需要补充跟金融机构的合作协议，并在广告中说明相关金融业务和活动介绍</p>\n<p>&nbsp;&nbsp;&nbsp;3）如是涉及商家自身业务补贴优惠活动，需在广告中说明详细活动内容并引导到店了解</p>\n<p>5、贷款类广告还需遵循如下规定：</p>\n<p>&nbsp;&nbsp;&nbsp;1）贷款广告不得使用 “0门槛”的描述，不可是用仅凭身份证即可贷款、不看征信可贷款等描述</p>\n<p>&nbsp;&nbsp;&nbsp;2）禁止出现还款无压力、轻松还款等描述</p>\n<p>&nbsp;&nbsp;&nbsp;3）不得使用诱导性贷款描述（如欠款太多还补上、逾期不可怕）</p>\n<p>&nbsp;&nbsp;&nbsp;4）不得投放针对学生，高校客群的贷款产品</p>\n<p>&nbsp;&nbsp;&nbsp;5）不得出现以下词语：身份证即可办理、砍头息、0 利息、无息、包批、包下款、不看征信、黑户、担保无抵押、秒借、0 风险、高收益、高回报等不符合实际的描述</p>\n<p>&nbsp;&nbsp;&nbsp;6）在使用日费率、月费率的同时，需要在稿件中标注年化费率，且符合费率区间，累计利率不得超过24%（借贷双方约定的利率未超过年利率24%，出借人有请求借款人按照约定的利率支付利息）</p>\n<p>&nbsp;&nbsp;&nbsp;7）不得含有超前消费、过度消费和从众消费等错误观念内容</p>\n<p></p>\n<p><strong>五、关于酒类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>酒类广告不得含有下列内容：</strong>&nbsp;</p>\n<p>&nbsp;1）诱导、怂恿饮酒或者宣传无节制饮酒；&nbsp;</p>\n<p>&nbsp;2）出现饮酒的动作（如：举起酒杯，或举杯朝嘴部的相似动作、劝酒/灌酒等动作）；</p>\n<p>&nbsp;3）表现驾驶车、船、飞机等活动；&nbsp;</p>\n<p>&nbsp;4）明示或者暗示饮酒有消除紧张和焦虑、增加体力等功效。</p>\n<p>&nbsp;5）含有未成年人的形象（包含未成年人的卡通形象）</p>\n<p>&nbsp;6）使用医疗用语或者易与药品混淆的用语</p>\n<p></p>\n<p><strong>六、关于母婴类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>母婴食品类广告不得含有下列内容：</strong></p>\n<p>&nbsp;1）不得明示或者暗示可以替代母乳，不得使用母乳哺乳中的妇女和婴儿的形象</p>\n<p>&nbsp;2）不得对0-12个月婴儿食用的奶粉进行广告宣传</p>\n<p>&nbsp;3）不得使用进口奶源、源自国外牧场、生态牧场、进口原料”等模糊信息； 涉及原料来源的（如生乳、原料乳粉等原料来源），应当如实标明具体来源地或者来源； 如：新西兰进口奶源、源自澳大利亚牧场等</p>\n<p>&nbsp;4）不得明示或者暗示具有益智、增加抵抗力或者免疫力、保护肠道等功能性表述。不得对于按照食品安全标准不应当在产品配方中含有或者使用的物质，以“不添加”“不含有”“零添加”等字样强调未使用或者不含有</p>\n<p></p>\n<p><strong>七、关于征婚交友类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>征婚交友广告不得含有下列内容：</strong></p>\n<p>&nbsp;1）婚恋交友行业广告出现有歧义、淫秽、隐晦、擦边等内容；&nbsp;</p>\n<p>&nbsp;2）出现夕阳红、二婚等内容；&nbsp;</p>\n<p>&nbsp;3）出现分离小三、婚姻破裂等</p>\n<p></p>\n<p><strong>八、关于招聘类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>招聘广告不得含有下列内容：</strong></p>\n<p>&nbsp;1）稿件上职位不得与实际推荐职位不一致；&nbsp;</p>\n<p>&nbsp;2）稿件以及落地必须为开户通过审核的产品平台，不得跳转至其他招聘平台；</p>\n<p>&nbsp;3）广告素材内提及工作薪资，须在稿件内体现或提供相关证明；&nbsp;</p>\n<p>&nbsp;4）出现工作职能描述不清的职业；</p>\n<p>&nbsp;5）出现工作描述仅为：在家躺着也能赚钱、一部手机就能赚钱等</p>\n<p>&nbsp;6）出现低俗擦边职业描述：学生妹晚上去赚点零花钱等</p>\n<p>&nbsp;7）出现打字员、刷单、涨粉、刷评论等职位</p>\n<p></p>\n<p><strong>九、关于教育类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>教育培训类广告不得含有下列内容：</strong></p>\n<p>&nbsp;1）对升学、通过考试、获得学位学历或者合格证书，或者对教育、培训的效果作出明示或者暗示的保证性承诺，如包过、百分百通过、保过、100%通过、包通过、保通过、免考拿本科、免学等承诺性描述</p>\n<p>&nbsp;2）明示或者暗示有相关考试机构或者其工作人员、考试命题人员参与教育、培训</p>\n<p>&nbsp;3）利用科研单位、学术机构、教育机构、行业协会、专业人士、受益者的名义或者形象作推荐、证明</p>\n<p>&nbsp;4）非学位授予单位不得声称可以授予学位</p>\n<p>&nbsp;5）以新闻报道的形式或以“国家发布新规”、“教育改革”等虚假信息做宣传，误导消费者</p>\n<p>&nbsp;6）涉及虚假宣传，使用“奖学金”、“高薪、高收入”等为噱头诱导用户点击</p>\n<p>&nbsp;7）金融类课程：涉及单个理财项目，个人教师项目，暗示成效（如：学了之后能赚大钱）</p>\n<p>&nbsp;8）医疗类课程：涉及失传秘方教育，明示医疗成效等</p>\n<p>&nbsp;9）涉及宣导学习某一技术/技能为由，不上大学、不上高中等</p>\n<p>&nbsp;10）涉及K12阶段的任意培训辅导等（需管控教育阶段：幼儿园、小学、初中、高中；学科类课外培训：语文、数学、外语、物理、化学、地理、政治、历史、生物等应试范围的基础学科类培训）</p>\n<p>&nbsp;11）普通组织机构不得在广告中使用“大学”“学院”字样（除经批准设立的大学、学院以及由其设立的内部机构或由其发起并依法登记的组织机构外）</p>\n<p></p>\n<p><strong>十、关于电商类推广基本审核规范</strong></p>\n<p></p>\n<p>1、广告应当真实、合法，以健康的表现形式表达广告内容</p>\n<p>不得对商品的性能、功能、产地、用途、质量、成分、价格、生产者、有效期限等进行夸大或承诺性描述</p>\n<p>2、若广告商品满足下述条件，还需提供相关正品证明</p>\n<p>&nbsp;1）奢侈品、知名品牌（包括但不限于鞋、包、表、手机、相机等）</p>\n<p>&nbsp;2）数码3C折扣低于5折（含5折）；其他类别折扣低于3折（含3折）</p>\n<p>3、若广告内容含有优惠活动信息，则需在广告显著位置进行说明，包括：</p>\n<p>1）在稿件上进行明示（如限时秒杀活动），且不可将活动价作为正常价格展示，以致误导用户，构成虚假宣传</p>\n<p>2）稿件所描述活动细则需与实际活动描述一致，</p>\n<p>3）若稿件上有活动，实际导向活动无细则，还需要额外提供活动证明</p>\n<p></p>\n<p><strong>十一、关于普通食品类推广基本审核规范</strong></p>\n<p></p>\n<p><strong>普通食品广告不得含有下列内容：</strong></p>\n<p>&nbsp;1）不得含有“纯天然”等虚假描述（注：只要是经过人工培育，无论是否为天然长成均不属于”纯天然“）</p>\n<p>&nbsp;2）不得单纯描述无添加食品，文案中需标记注释无添加元素（如：不添加香精防腐剂）</p>\n<p>&nbsp;3）金银箔粉不属于食品添加剂，不能用于食品生产经营。不得发布以金银箔粉作为食品原料或者食品添加剂生产的食品广告（含国产和进口食品），不得发布经营可食用金银箔粉的广告</p>\n<p>&nbsp;4）不得发布以食品添加金银箔粉（含）为噱头宣扬奢靡享乐、拜金主义等违背社会良好风尚的广告</p>\n<p>&nbsp;5）食品广告中不得明示或者暗示金银箔粉可食用，也不得借助食品添加金银箔粉宣传具有保健功能、治疗功效等特殊功效</p>\n<p></p>\n<p></p>\n<p></p>\n<p></p>\n<p></p>\n<p></p>\n"},"headTitle":"","lineHeight":26,"_asyncData":{}},"version":"0.0.17"}};

        docEl.style.fontSize =

    var docEl = doc.documentElement;
    var resizeEvt =
        "orientationchange" in window ? "orientationchange" : "resize";
    if (!doc.addEventListener) return;
    win.addEventListener(resizeEvt, recalc, false);
    recalc();
