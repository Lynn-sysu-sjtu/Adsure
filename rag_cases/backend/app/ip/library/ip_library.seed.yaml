# ══════════════════════════════════════════════════════════════════════
#  高危 IP 实体库 · 起始清单（讨论底稿）
#  来源：实施方案 v2 第五节建议清单，需与法务共同确认（§14 事项②）
#
#  ⚠️ reviewed_by_legal=false：本文件只能用于工程联调，法务确认前
#     不得用于对外报告。哪些权利主体进库、各需什么授权材料，是法律判断。
#
#  参考图放 library/images/<ip_id>/，reference_images 写相对路径；
#  图片仅内部特征比对、不对外分发；是否只存 embedding 不存原图待权衡
#  （方案 §12 风险登记册）。
# ══════════════════════════════════════════════════════════════════════

meta:
  name: 高危 IP 起始清单
  version: "0.1.0-seed"
  reviewed_by_legal: false

# 授权材料默认三件套；个别主体需要特殊材料时在条目里覆盖。
_x_anchor_materials: &materials
  - 权利人或其授权主体出具的官方授权书
  - 授权范围与期限证明
  - 授权地域证明（覆盖本次投放地域）
_x_anchor_law: &law
  - 《中华人民共和国著作权法》第十条
  - 《中华人民共和国商标法》第五十七条

