# ══════════════════════════════════════════════════════════════════════
#  构成要件库：把法条拆成可逐项判断的子问题
# ══════════════════════════════════════════════════════════════════════
#
# 为什么不直接问大模型「这构成违规吗」：
#
#   一次性提问 → 模型给一个整体结论，你无从知道它是哪一步想错的；
#                 它也可能认了法条却在事实判断上跳步。
#   要件拆解   → 模型只回答事实层面的子问题（是/否/依赖未提供的事实），
#                 最终定性由代码按逻辑推导。模型越不过要件直接下结论，
#                 结论也能追溯到具体是哪一条要件出了问题。
#
# 要件挂在**法条**上而不是词条上：第九条第三项的要件被 L1 的 49 个词共用，
# 挂词条上要写 49 遍，改一次要改 49 处。
#
# ⚠️ 未经法务复核。要件的拆法直接决定判定结果，是本项目里最需要
#    法律专业意见的一份文件 —— 比词库更需要。
# ══════════════════════════════════════════════════════════════════════

meta:
  version: "0.1.0-draft"
  reviewed_by_legal: false

rules:
  # ── 绝对化用语 ──────────────────────────────────────────────────
  ADLAW-009-03:
    name: 绝对化用语
    law_ref: "《广告法》第九条第（三）项"
    guideline: "《广告绝对化用语执法指南》（市场监管总局，2023）"
    # 要件全部成立才构成违规；任一条明确不成立即不构成。
    # 这里的四条豁免直接对应执法指南第五至八条。
    elements:
      - id: points_to_goods
        question: >-
          该表述是否指向广告所推销的商品或服务本身（而非仅描述经营者的
          服务态度、经营理念、企业文化、价值观或目标追求）？
        required: true
        if_not: 依据执法指南，未指向所推销商品的绝对化用语不适用本项
        needs_material: false

      - id: not_time_or_space_order
        question: >-
          该表述是否**不属于**表示时间或空间顺序的用法
          （如「第一时间」「第一步」「第一排」）？
        required: true
        if_not: 属执法指南列举的豁免情形，不构成本项违规
        needs_material: false

      - id: not_official_grade
        question: >-
          该表述是否**不属于**依据国家标准、行业标准对商品等级或类别
          作出的客观描述（如「特级初榨橄榄油」「一级能效」）？
        required: true
        if_not: 属客观分级描述，不构成本项违规
        # 实测发现：模型常对这一条答「无法判断」——它无从知道某个词
        # 是不是某项标准里的等级名称。这是合理的谨慎，
        # 但当时没配 material_hint，报告就会说「请提供下列材料」却给不出清单。
        needs_material: true
        material_hint: 该表述所依据的国家标准或行业标准文本、产品执行标准编号

      - id: lacks_substantiation
        question: >-
          该表述是否**缺乏**可查证的证据支撑
          （如权威机构评选结果、独立第三方统计数据，且标明来源与统计口径）？
        required: true
        if_not: 有充分证据证明真实性的，依执法指南可不认定为违规
        # 这一条常常答不了 —— 广告素材本身看不出有没有举证材料。
        # 答不了就是「需事实核验」，向运营要材料，而不是猜。
        needs_material: true
        material_hint: 第三方数据来源、统计口径与统计时段、评选机构与评选时间

  # ── 非医疗类广告涉及疾病治疗功能 ────────────────────────────────
  ADLAW-017:
    name: 涉及疾病治疗功能
    law_ref: "《广告法》第十七条"
    elements:
      - id: not_medical_ad
        question: >-
          该广告是否**不属于**医疗、药品、医疗器械广告？
        required: true
        if_not: 属医疗类广告，本条不适用（另适用第十六条等专门规定）
        needs_material: false

      - id: involves_disease_function
        question: >-
          广告内容是否涉及疾病预防或治疗功能，或使用了医疗用语，
          或使用了易使商品与药品、医疗器械相混淆的用语？
        required: true
        if_not: 未涉及疾病治疗功能或医疗用语，不构成本条违规
        needs_material: false

  # ── 保健食品：疾病功效 ──────────────────────────────────────────
  ADLAW-018-01-02:
    name: 保健食品涉及疾病预防治疗功能
    law_ref: "《广告法》第十八条第一款第（二）项"
    elements:
      - id: is_health_food_ad
        question: 该广告是否为保健食品广告？
        required: true
        if_not: 非保健食品广告，本项不适用
        needs_material: false

      - id: beyond_registered_function
        question: >-
          该表述是否**超出**了已注册的法定保健功能范围、涉及疾病预防或治疗？
          注意：「增强免疫力」「改善睡眠」「缓解体力疲劳」「辅助降血压」等
          属国家批准的保健功能，产品经注册后可依法宣称，**不构成本项违规**；
          而「治疗高血压」「根治胃病」则超出保健功能范围。
        required: true
        if_not: 属已注册的法定保健功能宣称，不构成本项违规
        needs_material: true
        material_hint: 保健食品注册证书及其载明的保健功能范围

  # ── 保健食品：必备声明 ──────────────────────────────────────────
  ADLAW-018-02:
    name: 保健食品必备声明未显著标明
    law_ref: "《广告法》第十八条第二款"
    elements:
      - id: is_health_food_ad
        question: 该广告是否为保健食品广告？
        required: true
        if_not: 非保健食品广告，本款不适用
        needs_material: false

      - id: not_prominently_marked
        question: >-
          「本品不能代替药物」是否**未以显著方式标明**？
          判断需结合呈现时长、字号占比、画面位置等整体情境。
          ⚠️ 法律上「显著」无统一量化标准，系统给出的度量仅为复核触发线，
          最终认定须由人判断。
        required: true
        if_not: 已显著标明，不构成本款违规
        needs_material: false

  # ── 虚假广告 ────────────────────────────────────────────────────
  ADLAW-028:
    name: 虚假或引人误解
    law_ref: "《广告法》第二十八条"
    elements:
      - id: content_inconsistent
        question: >-
          广告所述内容（性能、功能、销售状况、曾获荣誉、允诺等）
          是否与实际情况不符，或以引人误解的方式表达？
        required: true
        if_not: 内容与实际相符且不致误解，不构成虚假广告
        needs_material: true
        material_hint: 支撑该表述的事实材料，如销量数据、获奖证明、履约记录

      - id: material_influence
        question: 该不符或误解是否足以对消费者的购买行为产生实质性影响？
        required: true
        if_not: 未达到实质性影响程度
        needs_material: false

# 词条 rule_id → 要件规则 的映射。
# 词库里的 rule_id 对齐的是团队既有规则目录，粒度较粗（如 ADLAW-018），
# 这里再细分到款项，因为要件是按款项定义的。
rule_aliases:
  ADLAW-018: ADLAW-018-01-02
  ADLAW-009: ADLAW-009-03
